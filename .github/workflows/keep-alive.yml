# v10.23: keeps the free Supabase project awake.
# Free projects pause after about 7 days with no activity. This asks the database for one tiny row every 3 days,
# using only the PUBLIC address and key already in config/business.json (no secrets, nothing is changed).
# It needs this project to be on GitHub with Actions switched on. You can also run it by hand: Actions > Keep database awake > Run workflow.
name: Keep database awake
on:
  schedule:
    - cron: "17 5 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ask the database for one row
        run: |
          URL=$(jq -r '.supabase.url' config/business.json)
          KEY=$(jq -r '.supabase.key' config/business.json)
          CODE=$(curl -s -o /tmp/out.json -w "%{http_code}" "$URL/rest/v1/site_data?select=key&limit=1" -H "apikey: $KEY")
          echo "Database answered with HTTP $CODE"
          cat /tmp/out.json; echo
          test "$CODE" = "200"
